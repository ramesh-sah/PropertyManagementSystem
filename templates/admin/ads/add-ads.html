{% extends 'admin/admin_base/admin_base.html' %} {% load static %}
html' %} {% load static %} {% block content %}

<div class="content-body">
  <div class="container-fluid">
    <!-- row -->
    <div class="row">
      <div class="col-12">
        <div class="card">
          <div class="card-header">
            <h4 class="card-title">Add Ads</h4>
          </div>
          <div class="card-body">
            <form method="POST" enctype="multipart/form-data">
              {% csrf_token %}  
              <div class="row">
                 <!-- Ads Title -->
  <div class="mb-3 col-lg-4 col-md-6">
    <label class="form-label">Ads Title</label>
    <input
      type="text"
      class="form-control"
      placeholder="Name of the Ad"
      required=""
      name="ads_title"
    />
  </div>

  <!-- Description -->
  <div class="mb-3 col-lg-4 col-md-6">
    <label class="form-label">Description</label>
    <textarea
      class="form-control"
      placeholder="Description of the Ad"
      required=""
      name="description"
      rows="4"
    ></textarea>
  </div>

  <!-- Image -->
  <div class="mb-3 col-lg-4 col-md-6">
    <label class="form-label">Image</label>
    <input
      type="file"
      class="form-control"
      accept="image/*"
      name="image"
    />
  </div>

  <!-- URL -->
  <div class="mb-3 col-lg-4 col-md-6">
    <label class="form-label">Landing Page URL</label>
    <input
      type="url"
      class="form-control"
      placeholder="Ad Landing Page URL"
      required=""
      name="url"
    />
  </div>

  <!-- Start Date -->
  <div class="mb-3 col-lg-4 col-md-6">
    <label class="form-label">Start Date</label>
    <input
      type="datetime-local"
      class="form-control"
      required=""
      name="start_date"
    />
  </div>

  <!-- End Date -->
  <div class="mb-3 col-lg-4 col-md-6">
    <label class="form-label">End Date</label>
    <input
      type="datetime-local"
      class="form-control"
      required=""
      name="end_date"
    />
  </div>
                <div class="col-sm-12 pt-3">
                  <button type="submit" class="btn btn-sm btn-primary me-2">
                    Submit
                  </button>
                  <button type="button" class="btn btn-sm btn-danger light">
                    Cancel
                  </button>
                </div>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock content %}
