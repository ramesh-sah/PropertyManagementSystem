{% load static %}
<!DOCTYPE html>
<html lang="en">
  <head>
    <!-- Title -->
    <title>Omah - Real Estate Admin Dashboard Template</title>

    <!-- Meta -->
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="author" content="DexignZone" />
    <meta name="robots" content="index, follow" />

    <meta
      name="keywords"
      content="admin, dashboard, admin dashboard, admin template, template, admin panel, administration, analytics, bootstrap, hospital admin, modern, property, real estate, responsive, creative, retina ready, modern Dashboard"
    />
    <meta
      name="description"
      content="Your Ultimate Real Estate Admin Dashboard Template. Streamline property management, analyze market trends, and boost productivity with our intuitive and feature-rich solution. Elevate your real estate business today!"
    />

    <meta
      property="og:title"
      content="Omah - Real Estate Admin Dashboard Template"
    />
    <meta
      property="og:description"
      content="Your Ultimate Real Estate Admin Dashboard Template. Streamline property management, analyze market trends, and boost productivity with our intuitive and feature-rich solution. Elevate your real estate business today!"
    />
    <meta property="og:image" content="social-image.png" />
    <meta name="format-detection" content="telephone=no" />

    <meta
      name="twitter:title"
      content="Omah - Real Estate Admin Dashboard Template"
    />
    <meta
      name="twitter:description"
      content="Your Ultimate Real Estate Admin Dashboard Template. Streamline property management, analyze market trends, and boost productivity with our intuitive and feature-rich solution. Elevate your real estate business today!"
    />
    <meta name="twitter:image" content="social-image.png" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- MOBILE SPECIFIC -->
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- Favicon icon -->
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="static/images/favicon.png"
    />
    <link href="{% static 'css/style.css' %}" rel="stylesheet" />
  </head>

  <body>
    <div class="fix-wrapper">
      <div class="container">
        <div class="row justify-content-center">
          <div class="col-lg-5 col-md-6">
            <div class="card mb-0 h-auto">
              <div class="card-body">
                <div class="text-center mb-3">
                  <a href="index-2.html"
                    ><img
                      class="logo-auth"
                      src="static/images/logo-full.png"
                      alt=""
                  /></a>
                </div>
                <h4 class="text-center mb-4">Sign up your account</h4>
                <form method="POST" action="{% url 'account:user-register'%}">
                  {% csrf_token %}
                  <div class="form-group mb-4">
                    <label class="form-label" for="first_name"
                      >First Name</label
                    >
                    <input
                      type="text"
                      name="first_name"
                      class="form-control"
                      placeholder="Enter first name"
                      id="first_name"
                      required=""
                    />
                  </div>
                  <div class="form-group mb-4">
                    <label class="form-label" for="last_name">Last Name</label>
                    <input
                      type="text"
                      name="last_name"
                      class="form-control"
                      placeholder="Enter last name"
                      id="last_name"
                      required=""
                    />
                  </div>

                  <div class="form-group mb-4">
                    <label class="form-label" for="email">Email</label>
                    <input
                      type="email"
                      name="email"
                      class="form-control"
                      placeholder="hello@example.com"
                      id="email"
                      required=""
                    />
                  </div>
                  <div class="form-group mb-4">
                    <label class="form-label" for="user_type"
                      >Select User Type</label
                    >
                    <div class="d-flex flex-wrap mb-3">
                      <div class="form-check custom-radio me-3">
                        <input
                          type="radio"
                          class="form-check-input"
                          id="agent"
                          name="user_type"
                          value="agent"
                          required=""
                        />
                        <label class="form-check-label" for="agent"
                          >Agent</label
                        >
                      </div>
                      <div class="form-check custom-radio me-3">
                        <input
                          type="radio"
                          class="form-check-input"
                          id="customer"
                          name="user_type"
                          value="customer"
                          required=""
                        />
                        <label class="form-check-label" for="customer"
                          >Customer</label
                        >
                      </div>
                    </div>
                  </div>

                  <div class="form-group mb-sm-4 mb-3">
                    <label class="form-label">Password</label>
                    <div class="position-relative">
                      <input
                        type="password"
                        name="password"
                        id="dz-password"
                        class="form-control"
                        required=""
                      />
                      <span class="show-pass eye">
                        <i class="fa fa-eye-slash"></i>
                        <i class="fa fa-eye"></i>
                      </span>
                    </div>
                  </div>


                  <div class="form-group mb-sm-4 mb-3">
                    <label class="form-label">Password</label>
                    <div class="position-relative">
                      <input
                        type="password"
                        name="confirm_password"
                        id="dz-password"
                        class="form-control"
                        required=""
                      />
                      <span class="show-pass eye">
                        <i class="fa fa-eye-slash"></i>
                        <i class="fa fa-eye"></i>
                      </span>
                    </div>
                  </div>

              

                  <div class="text-center">
                    <button type="submit" class="btn btn-primary btn-block">
                      Sign up
                    </button>
                  </div>
                </form>
                <div class="new-account mt-3">
                  <p>
                    Already have an account?
                    <a
                      class="text-primary"
                      href="{% url 'account:user-login' %}"
                      >Sign in</a
                    >
                  </p>
                </div>

                


              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
    {% include "AlertMessage/alertMessage.html" %}
    <!--**********************************
	Scripts
***********************************-->
    <!-- Required vendors -->
    <script src="{% static 'vendor/global/global.min.js'%}"></script>
    <script src="{% static 'vendor/bootstrap-select/dist/js/bootstrap-select.min.js'%}"></script>
    <script src="{% static 'js/custom.min.js'%}"></script>
    <script src="{% static 'js/deznav-init.js}"></script>
  </body>
</html>
