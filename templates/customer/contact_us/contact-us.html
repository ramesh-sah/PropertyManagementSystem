{% extends 'customer/customer_base/customer_base.html' %} {% load static %}{% block content %}
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contact Us</title>
    <link rel="stylesheet" href="/static/css/style.css" />
    <style>
      body {
        font-family: Arial, sans-serif;
        margin: 0;
        padding: 0;
        background-color: #f4f4f4;
      }
      main {
        padding-top: 60px;
      }
      .slider-area {
        position: relative;
        height: 300px;
        background-color: #333;
      }
      .slider-area img {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      .hero-caption h1 {
        font-size: 3rem;
        text-align: center;
        padding-top: 100px;
        color: black;
      }
      .hero-caption p {
        text-align: center;
        font-size: 1.2rem;
        color: white;
      }
      .contact-section {
        padding: 60px 0;
      }
      .contact-title {
        text-align: center;
        font-size: 2.5rem;
        color: #333;
        margin-bottom: 40px;
      }
      .form-contact {
        background-color: #fff;
        padding: 30px;
        box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
      }
      .form-group {
        margin-bottom: 20px;
      }
      .form-control {
        width: 100%;
        padding: 12px;
        border: 1px solid #ddd;
        border-radius: 5px;
        font-size: 1rem;
      }
      .form-control:focus {
        border-color: #007bff;
        outline: none;
      }
      .button-contactForm {
        background-color: #007bff;
        color: white;
        border: none;
        padding: 12px 20px;
        font-size: 1.1rem;
        cursor: pointer;
        border-radius: 5px;
        transition: background-color 0.3s;
      }
      .button-contactForm:hover {
        background-color: #0056b3;
      }
      .contact-info {
        margin-bottom: 20px;
        display: flex;
        align-items: center;
      }
      .contact-info__icon {
        font-size: 1.8rem;
        margin-right: 15px;
      }
      .contact-info h3 {
        font-size: 1.4rem;
        margin: 0;
        color: #333;
      }
      .contact-info p {
        color: #777;
      }
      .container {
        width: 85%;
        margin: 0 auto;
      }
      .row {
        display: flex;
        flex-wrap: wrap;
      }
      .col-lg-8,
      .col-lg-3 {
        padding: 15px;
      }
      .col-lg-8 {
        flex: 2;
      }
      .col-lg-3 {
        flex: 1;
      }
    </style>
  </head>
  <body>
<div class="content-body">
  <div class="container-fluid">
    <!-- row -->
    <div class="row">
      <main>
      <div class="slider-area" style="position: relative; height: 300px">
        <!-- Add your image here -->
        <img
          src="{% static 'images/property/4.jpg' %}"
          alt="Contact Us Image"
          style="width: 100%; height: 100%; object-fit: cover"
        />
        <div
          class="hero-caption"
          style="
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            text-align: center;
            width: 100%;
          "
        >
          <h1 style="font-size: 3rem; margin: 0">Contact Us</h1>
          <p style="font-size: 1.2rem; margin-top: 10px">
            Feel free to get in touch with us!
          </p>
        </div>
      </div>

      <section class="contact-section">
        <div class="container">
          <div class="row">
            <div class="col-lg-8">
              <form
                class="form-contact contact_form"
                action="/contact/"
                method="POST"
                novalidate="novalidate"
              >
                <div class="row">
                  <div class="col-12">
                    <div class="form-group">
                      <textarea
                        class="form-control w-100"
                        name="message"
                        id="message"
                        cols="30"
                        rows="9"
                        onfocus="this.placeholder = ''"
                        onblur="this.placeholder = 'Enter Message'"
                        placeholder="Enter Message"
                      ></textarea>
                    </div>
                  </div>
                  <div class="col-sm-6">
                    <div class="form-group">
                      <input
                        class="form-control valid"
                        name="name"
                        id="name"
                        type="text"
                        onfocus="this.placeholder = ''"
                        onblur="this.placeholder = 'Enter your name'"
                        placeholder="Enter your name"
                      />
                    </div>
                  </div>
                  <div class="col-sm-6">
                    <div class="form-group">
                      <input
                        class="form-control valid"
                        name="email"
                        id="email"
                        type="email"
                        onfocus="this.placeholder = ''"
                        onblur="this.placeholder = 'Enter email address'"
                        placeholder="Email"
                      />
                    </div>
                  </div>
                  <div class="col-12">
                    <div class="form-group">
                      <input
                        class="form-control"
                        name="subject"
                        id="subject"
                        type="text"
                        onfocus="this.placeholder = ''"
                        onblur="this.placeholder = 'Enter Subject'"
                        placeholder="Enter Subject"
                      />
                    </div>
                  </div>
                </div>
                <div class="form-group mt-3">
                  <button type="submit" class="button-contactForm boxed-btn">
                    Send
                  </button>
                </div>
              </form>
            </div>
            <div class="col-lg-3 offset-lg-1">
              <div class="media contact-info">
                <span class="contact-info__icon"><i class="ti-home"></i></span>
                <div class="media-body">
                  <h3>123 Main Street, City, Country</h3>
                </div>
              </div>
              <div class="media contact-info">
                <span class="contact-info__icon"
                  ><i class="ti-tablet"></i
                ></span>
                <div class="media-body">
                  <h3>+123 456 7890</h3>
                  <p>Feel free to call us!</p>
                </div>
              </div>
              <div class="media contact-info">
                <span class="contact-info__icon"><i class="ti-email"></i></span>
                <div class="media-body">
                  <h3>info@example.com</h3>
                  <p>Send us your query anytime!</p>
                </div>
              </div>
            </div>
          </div>
        </div>
      </section>
    </main>
    </div>
    
    
  </div>
</div>
  </body>
</html>

{% endblock %}
