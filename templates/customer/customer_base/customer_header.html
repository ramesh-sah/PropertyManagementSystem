{% load static %}

<html lang="en">
  <head>
    <!-- Title -->
    <title>
      {% block title %} Omah - Real Estate Admin Dashboard Template {% endblock
      %}
    </title>

    <!-- Meta -->
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="author" content="DexignZone" />
    <meta name="robots" content="index, follow" />

    <meta
      name="keywords"
      content="admin, dashboard, admin dashboard, admin template, template, admin panel, administration, analytics, bootstrap, hospital admin, modern, property, real estate, responsive, creative, retina ready, modern Dashboard"
    />
    <meta
      name="description"
      content="Your Ultimate Real Estate Admin Dashboard Template. Streamline property management, analyze market trends, and boost productivity with our intuitive and feature-rich solution. Elevate your real estate business today!"
    />

    <meta
      property="og:title"
      content="Omah - Real Estate Admin Dashboard Template"
    />
    <meta
      property="og:description"
      content="Your Ultimate Real Estate Admin Dashboard Template. Streamline property management, analyze market trends, and boost productivity with our intuitive and feature-rich solution. Elevate your real estate business today!"
    />
    <meta property="og:image" content="social-image.png" />
    <meta name="format-detection" content="telephone=no" />

    <meta
      name="twitter:title"
      content="Omah - Real Estate Admin Dashboard Template"
    />
    <meta
      name="twitter:description"
      content="Your Ultimate Real Estate Admin Dashboard Template. Streamline property management, analyze market trends, and boost productivity with our intuitive and feature-rich solution. Elevate your real estate business today!"
    />
    <meta name="twitter:image" content="social-image.png" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- MOBILE SPECIFIC -->
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- Favicon icon -->
    <link rel="icon" type="image/png" sizes="16x16" href="images/favicon.png" />
    <!-- Custom Stylesheet -->
    <link
      href="{% static 'vendor/bootstrap-select/dist/css/bootstrap-select.min.css' %}"
      rel="stylesheet"
    />
    <link
      href="{%static 'vendor/swiper/css/swiper-bundle.min.css' %}"
      rel="stylesheet"
    />
    <link
      href="{% static 'vendor/magnific-popup/magnific-popup.min.css' %}"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="{% static 'vendor/nouislider/nouislider.min.css' %}"
    />
    <link href="{% static 'css/style.css' %}" rel="stylesheet" />
  </head>

  <body>
    <!--*******************
        Preloader start
    ********************-->
    <div id="preloader">
      <div class="sk-three-bounce">
        <div class="sk-child sk-bounce1"></div>
        <div class="sk-child sk-bounce2"></div>
        <div class="sk-child sk-bounce3"></div>
      </div>
    </div>
    <!--*******************
        Preloader end
    ********************-->

    <!--**********************************
        Main wrapper start
    ***********************************-->
    <div id="main-wrapper">
      <!--**********************************
            Nav header start
        ***********************************-->
      <div class="nav-header">
        <a href="index.html" class="brand-logo">
          <img class="logo-abbr" src="{% static 'images/logo.png' %}" alt="/" />
          <img
            class="logo-compact"
            src="{% static 'images/logo-text.png' %}"
            alt="/"
          />
          <img
            class="brand-title"
            src="{% static 'images/logo-text.png' %}"
            alt="/"
          />
        </a>

        <div class="nav-control">
          <div class="hamburger">
            <span class="line"></span><span class="line"></span
            ><span class="line"></span>
          </div>
        </div>
      </div>
      <!--**********************************
            Nav header end
        ***********************************-->

      <!--**********************************
            Header start
        ***********************************-->
      <div class="header">
        <div class="header-content">
          <nav class="navbar navbar-expand">
            <div class="collapse navbar-collapse justify-content-end">
              <ul class="navbar-nav header-right">
                <li class="nav-item dropdown header-profile">
                  <a
                    class="nav-link"
                    href="javascript:void(0);"
                    role="button"
                    data-bs-toggle="dropdown"
                  >
                    <div class="header-info">
                      <span class="text-black">Henry Jr.</span>
                      <p class="fs-12 mb-0">Admin</p>
                    </div>
                    <img
                      src="{% static 'images/profile/17.jpg' %}"
                      width="20"
                      alt="/"
                    />
                  </a>
                  <div class="dropdown-menu dropdown-menu-end">
                    <a
                      href='{% url "account:customer-profile" %}'
                      class="dropdown-item ai-icon"
                    >
                      <svg
                        id="icon-user1"
                        xmlns="http://www.w3.org/2000/svg"
                        class="text-primary"
                        width="18"
                        height="18"
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="2"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                      >
                        <path
                          d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"
                        ></path>
                        <circle cx="12" cy="7" r="4"></circle>
                      </svg>
                      <span class="ms-2">Profile </span>
                    </a>

                    <a
                      href='{% url "account:user-logout" %}'
                      class="dropdown-item ai-icon"
                    >
                      <svg
                        id="icon-logout"
                        xmlns="http://www.w3.org/2000/svg"
                        class="text-danger"
                        width="18"
                        height="18"
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="2"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                      >
                        <path
                          d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"
                        ></path>
                        <polyline points="16 17 21 12 16 7"></polyline>
                        <line x1="21" y1="12" x2="9" y2="12"></line>
                      </svg>
                      <span class="ms-2">Logout </span>
                    </a>
                  </div>
                </li>
              </ul>
            </div>
          </nav>
        </div>
      </div>
      <!--**********************************
            Header end ti-comment-alt
        ***********************************-->
    </div>
  </body>
</html>
