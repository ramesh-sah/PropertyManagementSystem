{% load static %} 
<!DOCTYPE html>
<html lang="en">
  <head>
    <!-- Title -->
    <title>Omah - Real Estate Admin Dashboard Template</title>

    <!-- Meta -->
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="author" content="DexignZone" />
    <meta name="robots" content="index, follow" />

    <meta
      name="keywords"
      content="admin, dashboard, admin dashboard, admin template, template, admin panel, administration, analytics, bootstrap, hospital admin, modern, property, real estate, responsive, creative, retina ready, modern Dashboard"
    />
    <meta
      name="description"
      content="Your Ultimate Real Estate Admin Dashboard Template. Streamline property management, analyze market trends, and boost productivity with our intuitive and feature-rich solution. Elevate your real estate business today!"
    />

    <meta
      property="og:title"
      content="Omah - Real Estate Admin Dashboard Template"
    />
    <meta
      property="og:description"
      content="Your Ultimate Real Estate Admin Dashboard Template. Streamline property management, analyze market trends, and boost productivity with our intuitive and feature-rich solution. Elevate your real estate business today!"
    />
    <meta property="og:image" content="social-image.png" />
    <meta name="format-detection" content="telephone=no" />

    <meta
      name="twitter:title"
      content="Omah - Real Estate Admin Dashboard Template"
    />
    <meta
      name="twitter:description"
      content="Your Ultimate Real Estate Admin Dashboard Template. Streamline property management, analyze market trends, and boost productivity with our intuitive and feature-rich solution. Elevate your real estate business today!"
    />
    <meta name="twitter:image" content="social-image.png" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- MOBILE SPECIFIC -->
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- Favicon icon -->
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="static/images/favicon.png"
    />
    <link href="{% static 'css/style.css'%}" rel="stylesheet" />
  </head>

  <body>
    <div class="fix-wrapper">
      <div class="container">
        <div class="row justify-content-center">
          <div class="col-lg-5 col-md-6">
            <div class="card mb-0 h-auto">
              <div class="card-body">
                <div class="text-center mb-3">
                  <a href="index-2.html"
                    ><img
                      class="logo-auth"
                      src="{% static 'images/logo-full.png'%}"
                      alt=""
                  /></a>
                </div>
                <h4 class="text-center mb-4">Sign in your account</h4>
                <form method="POST">
                  {% csrf_token %}
                  <div class="form-group mb-4">
                    <label class="form-label" for="email">Email</label>
                    <input
                      name="email"
                      type="text"
                      class="form-control"
                      placeholder="Enter  Email"
                      id="username"
                    />
                  </div>
                  <div class="form-group mb-3 mb-sm-4">
                    <label class="form-label">Password</label>
                    <div class="position-relative">
                      <input
                        name="password"
                        type="password"
                        id="dz-password"
                        class="form-control"
                      />
                      <span class="show-pass eye">
                        <i class="fa fa-eye-slash"></i>
                        <i class="fa fa-eye"></i>
                      </span>
                    </div>
                  </div>
                  <div
                    class="form-row d-flex flex-wrap justify-content-between align-items-baseline mb-2"
                  >
                    <div class="form-group mb-sm-4 mb-1">
                      <div class="form-check custom-checkbox ms-1">
                        <input
                          type="checkbox"
                          class="form-check-input"
                          id="basic_checkbox_1"
                        />
                        <label class="form-check-label" for="basic_checkbox_1"
                          >Remember my preference</label
                        >
                      </div>
                    </div>
                    <div class="form-group ms-2">
                      <a href="page-forgot-password.html">Forgot Password?</a>
                    </div>
                  </div>
                  <div class="text-center">
                    <button type="submit" class="btn btn-primary btn-block">
                      Sign In
                    </button>
                  </div>
                </form>
                <div class="new-account mt-3">
                  <p>
                    Don't have an account?
                    <a
                      class="text-primary"
                      href='{% url "account:user-register" %}'
                      >Sign up</a
                    >
                  </p>

                  
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
    
{% include "AlertMessage/alertMessage.html" %}
    <!--**********************************
        Scripts
    ***********************************-->
    <!-- Required vendors -->
    <script src="{% static 'vendor/global/global.min.js'%}"></script>
    <script src="{% static 'vendor/bootstrap-select/dist/js/bootstrap-select.min.js'%}"></script>
    <script src="{% static 'js/custom.min.js'%}"></script>
    <script src="{% static 'js/deznav-init.js'%}"></script>
  </body>
</html>
